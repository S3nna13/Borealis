[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borealis-v2"
version = "2.0.0"
description = "Borealis — Evolved frontier AI runtime platform. Multi-model family + native skills + RAM/VRAM awareness + MCP + CUA + POLARIS governance."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "rich>=13.7",
  "numpy>=1.26",
  "torch>=2.4",
  "safetensors>=0.4",
  "mcp>=1.0",
  "vllm>=0.6",
  "litellm>=1.0",
  "ollama>=0.4",
  "openai>=1.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "click>=8.1",
  "psutil>=6.0",
]

[project.scripts]
borealis = "borealis_cli.v2_cli:main_v2"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "borealis_cli*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/runtime", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 180
target-version = "py312"
src = ["src", "borealis_cli"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
